name: Build and Push Docker Image to GHCR

on:
  push:
    branches: [ "main", "develop" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ommia-backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.generate_tag.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Image Tag
        id: generate_tag
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TIMESTAMP=$(TZ="Asia/Seoul" date +'%Y%m%d%H%M%S')
          IMAGE_TAG="${SHORT_SHA}-${TIMESTAMP}"
          
          echo "생성된 이미지 태그: ${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        run: |
          # 이미지명 소문자로 정의
          BASE_IMAGE_NAME=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
              
          IMAGE_TAG="${{ steps.generate_tag.outputs.image_tag }}"
          FULL_IMAGE_TAG="${BASE_IMAGE_NAME}:${IMAGE_TAG}"
        
          # 이미지 빌드 후 push
          docker build -t $FULL_IMAGE_TAG .           
          docker push $FULL_IMAGE_TAG 

  update-manifest:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}

    steps:
      - name: Checkout ommia-config repository
        uses: actions/checkout@v7
        with:
          repository: sim16065/ommia-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          ref: main

      - name: Update image tag in values-backend.yaml
        run: |
          sed -i "s|tag: \".*\"|tag: \"${IMAGE_TAG}\"|" ommia/values-backend.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ommia/values-backend.yaml
          git commit -m "chore: update backend image tag to ${IMAGE_TAG}"
          git push